#
# Builds vultureOS on Linux (Ubuntu, x86_64) with LLVM 22 from apt.llvm.org
# and runs every test: the host unit tests, then vultureOS booted in QEMU
# (boot, panic, kernel, userland and persistence tests), emulated (TCG).

name: Linux

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "Documentation/**"]
  pull_request:
    paths-ignore: ["**.md", "Documentation/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Ubuntu 24.04, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      VULTURE_LLVM_ROOT: /usr/lib/llvm-22
      VULTURE_LLD_ROOT: /usr/lib/llvm-22
      VULTURE_ACCEL: tcg
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install LLVM 22, Ninja and QEMU
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-22 lld-22 llvm-22 libclang-rt-22-dev \
            ninja-build qemu-system-arm qemu-efi-aarch64

      # AddressSanitizer needs room for its shadow memory, which the
      # runners' high address-space randomization can deny.
      - name: Let the sanitizers map their shadow memory
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Show the tools
        run: |
          /usr/lib/llvm-22/bin/clang++ --version
          /usr/lib/llvm-22/bin/ld.lld --version
          cmake --version | head -1
          echo "ninja $(ninja --version)"
          qemu-system-aarch64 --version | head -1
          ls -l /usr/share/AAVMF/

      - name: Build
        run: Meta/build.sh --build-dir build
